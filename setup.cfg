[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1

[coverage:run]
branch=True

[coverage:report]
show_missing=True
skip_covered=True

[flake8]
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist
max-line-length = 100
max-complexity = 10

[pylint]
disable =
    C0114,
    C0115,
    C0116
max-line-length = 100